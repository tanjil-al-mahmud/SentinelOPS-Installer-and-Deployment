# Standalone Logflare deployment.
#
# FALLBACK ONLY. Upstream Supabase ships analytics as an optional overlay
# enabled with `run.sh config add logs`, and the installer uses that whenever it
# is available. This file is used only when the installed Supabase release has
# no analytics service and no logs overlay at all.
#
# Variables follow the official self-hosting guide:
#   https://supabase.com/docs/reference/self-hosting-analytics/introduction
#
# Managed by sentinel-ops. See docs/LOGFLARE.md.

services:
  logflare:
    image: supabase/logflare:1.14.2
    container_name: sentinel-ops-logflare
    restart: unless-stopped
    ports:
      # Loopback only. Upstream does not publish this port at all, and warns
      # that Logflare's /dashboard has no authentication of its own.
      - "127.0.0.1:${LOGFLARE_PORT}:4000"
    environment:
      # --- required in every deployment ---
      LOGFLARE_SINGLE_TENANT: ${LOGFLARE_SINGLE_TENANT}
      LOGFLARE_SUPABASE_MODE: ${LOGFLARE_SUPABASE_MODE}

      # --- security ---
      # Must match the values in supabase/.env: vector authenticates with the
      # public token, Studio queries with the private one.
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      # Base64 key encrypting sensitive Logflare database columns.
      LOGFLARE_DB_ENCRYPTION_KEY: ${LOGFLARE_DB_ENCRYPTION_KEY}
      # Populated only while rotating the encryption key.
      LOGFLARE_DB_ENCRYPTION_KEY_RETIRED: ${LOGFLARE_DB_ENCRYPTION_KEY_RETIRED:-}
      SECRET_KEY_BASE: ${LOGFLARE_SECRET_KEY_BASE}

      # --- Postgres backend (default) ---
      # Upstream notes this backend is not optimised for high-volume ingest or
      # heavy querying, and recommends BigQuery for production.
      POSTGRES_BACKEND_URL: ${POSTGRES_BACKEND_URL}
      POSTGRES_BACKEND_SCHEMA: ${POSTGRES_BACKEND_SCHEMA:-_analytics}

      # --- BigQuery backend (set LOGFLARE_BACKEND=bigquery) ---
      # Also mount the service-account key below.
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-}
      GOOGLE_PROJECT_NUMBER: ${GOOGLE_PROJECT_NUMBER:-}

      LOGFLARE_FEATURE_FLAG_OVERRIDE: "multibackend=true"
      LOGFLARE_NODE_HOST: 127.0.0.1
      LOGFLARE_LOG_LEVEL: warn
      PHX_HTTP_PORT: "4000"
    # For the BigQuery backend in this standalone fallback, add the
    # service-account key mount yourself - there is no sane default to point a
    # bind mount at when the file is absent:
    #
    #   volumes:
    #     - ../supabase/gcloud.json:/opt/app/rel/logflare/bin/gcloud.json:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Logflare runs its database migrations on first boot.
      start_period: 60s
    networks:
      - supabase

networks:
  supabase:
    # The network the Supabase stack created; joining it lets Logflare reach
    # the database by service name.
    name: ${LOGFLARE_SUPABASE_NETWORK}
    external: true
