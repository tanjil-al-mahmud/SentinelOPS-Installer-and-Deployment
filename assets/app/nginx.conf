# Sentinel Ops frontend - nginx site configuration.
# __APP_PORT__ is substituted at image build time.

server {
    listen      __APP_PORT__;
    listen      [::]:__APP_PORT__;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Sensible defaults for an app served behind a TLS-terminating proxy.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff font/woff2;

    # Health endpoint used by the container healthcheck and the installer.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or clients keep loading a stale bundle
    # after a deployment.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Single-page application: unknown paths are routed to the app, which
    # resolves them client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
